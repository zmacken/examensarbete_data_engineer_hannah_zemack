name: 'flight_data_dbt'
version: '1.0.0'
profile: 'flight_data_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


seeds:
  flight_data_dbt:
    iata_airlines:
      +schema: seeds
      +column_types:
        IATA: varchar
        ICAO: varchar
        Airline: varchar
        "Telephony Designator": varchar
        "Country/Region": varchar
        Comments: varchar

models:
  flight_data_dbt:
    staging:
      +materialized: view       
      +schema: staging
    intermediate:               
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table      
      +schema: marts